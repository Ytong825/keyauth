# KeyAuth · Nginx 反向代理
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/keyauth
#   sudo sed -i 's/auth.example.com/你的域名/' /etc/nginx/sites-available/keyauth
#   sudo sed -i 's/1.2.3.4/你自己的公网IP/'  /etc/nginx/sites-available/keyauth
#   sudo ln -sf /etc/nginx/sites-available/keyauth /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 签发 HTTPS：
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d 你的域名

# 限流区（http 上下文）。20r/s 对正常客户端绰绰有余，能挡住卡密爆破。
limit_req_zone $binary_remote_addr zone=keyauth_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name auth.example.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    client_max_body_size 2m;
    access_log /var/log/nginx/keyauth.access.log;
    error_log  /var/log/nginx/keyauth.error.log;

    # ---------- 管理后台：只允许你自己的 IP ----------
    location /admin {
        allow 1.2.3.4;          # ← 换成你的公网 IP
        allow 127.0.0.1;
        deny all;

        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # ---------- 客户端接口：对公网开放 + 限流 ----------
    location /api/ {
        limit_req zone:keyauth_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # ---------- 静态资源 ----------
    location /static/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        expires 1h;
    }

    location = / { return 302 /admin; }

    location / { return 404; }
}
